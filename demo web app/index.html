<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Payment Gateway - Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>AZ Payment Gateway</h1>
                <p class="subtitle">Demo Application</p>
            </div>
            <div class="language-selector">
                <button id="langEn" class="lang-btn active">English</button>
                <button id="langAr" class="lang-btn">العربية</button>
            </div>
        </header>

        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb" id="breadcrumb">
            <span class="breadcrumb-item active">Categories</span>
        </nav>

        <!-- Loading Spinner -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Main Content Area -->
        <main class="content" id="content">
            <!-- Dynamic content will be inserted here -->
        </main>

        <!-- Modal for Multi-Step Services -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Next Step</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Dynamic modal content -->
                </div>
            </div>
        </div>

        <!-- Receipt Modal -->
        <div class="modal" id="receiptModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Transaction Receipt</h2>
                    <button class="close-btn" id="closeReceipt">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="receipt" id="receipt">
                        <!-- Receipt content will be inserted here -->
                    </div>
                    <button class="btn btn-primary" id="newTransaction">New Transaction</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
